source: 'Noms et plages de chapitres : ATIH, CIM-10 FR à usage PMSI, ClaML 2019, reproduits tels quels (mention
  d''origine, voir data/cards/cim10.md).'
notes:
- L'étiquette est le chapitre du code du diagnostic principal du scénario suggéré aux rédacteurs de PARHAF, pas
  un codage médical ni une lecture du compte rendu. En cas de désaccord entre le texte et le scénario, le scénario
  fait foi.
- 'Chaque patient du scénario porte exactement un diagnostic principal ; le chapitre se lit sur les trois premiers
  caractères du code (la lettre seule ne suffit pas : D et H sont à cheval sur deux chapitres). Les codes à suffixe
  + ou étendus à 5 caractères sont ramenés à leurs trois premiers.'
- 'La classe suit le code : pour les frontières entre chapitres, voir les exclusions de chaque classe.'
- La macro-F1 principale exclut la classe `autre` ; l'exactitude, la perte logarithmique et l'ECE la comptent comme
  une classe ordinaire.
- 'Entrée tronquée au-delà de 4096 tokens (2048 premiers et 2048 derniers, PROTOCOLE.md section 1) : concerne 0,2
  % des patients ; pas d''abstention au premier cycle.'
- 'Les noms de chapitres reprennent les graphies de l''ATIH sans correction (par exemple « souscutané », « ostéoarticulaire
  ») : la licence interdit de modifier le texte.'
