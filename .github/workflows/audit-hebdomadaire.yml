# Une vulnérabilité peut apparaître sans qu'aucun commit ne change : l'audit tourne aussi chaque lundi.
name: Audit hebdomadaire

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: pip-audit (exception W1 de CONSTRAINTS.md)
        run: .venv/bin/python -m pip_audit --progress-spinner off --ignore-vuln PYSEC-2026-3447
